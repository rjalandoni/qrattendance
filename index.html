  <script>
    var FIREBASE_PROJECT_ID = "qrattendance-39ba7";
    var FIREBASE_API_KEY = "AIzaSyA_mpRuJB1Dl1LE_8dVuuRnpvp3uaTiU0Y";
    var GUESTS_COLLECTION = "christmas_guests";
    var SCORING_COLLECTION = "event_scoring_2026";

    var GUESTS_URL = "https://firestore.googleapis.com/v1/projects/" + FIREBASE_PROJECT_ID + "/databases/(default)/documents/" + GUESTS_COLLECTION + "?key=" + FIREBASE_API_KEY;
    var SCORING_URL = "https://firestore.googleapis.com/v1/projects/" + FIREBASE_PROJECT_ID + "/databases/(default)/documents/" + SCORING_COLLECTION + "?key=" + FIREBASE_API_KEY;

    var LOCAL_GUESTS_KEY = "xmas_2026_guests_cache";
    var LOCAL_SCORING_KEY = "event_scoring_2026_cache";

    var guests = [];
    try { guests = JSON.parse(localStorage.getItem(LOCAL_GUESTS_KEY) || "[]"); } catch (e) { guests = []; }

    var scoringState = {
      criteria: [
        { name: "Creativity & Originality", max: 30 },
        { name: "Execution & Skill", max: 40 },
        { name: "Stage Presence & Impact", max: 30 }
      ],
      contestants: [],
      scores: []
    };
    try {
      var cachedScoring = JSON.parse(localStorage.getItem(LOCAL_SCORING_KEY) || "null");
      if (cachedScoring && cachedScoring.contestants) scoringState = cachedScoring;
    } catch (e) {}

    var currentPassGuest = null;
    var currentPassDataUrl = null;
    var html5QrScanner = null;
    var isSyncingNow = false;

    function toFirestoreFields(obj) {
      var fields = {};
      for (var k in obj) {
        var v = obj[k];
        if (typeof v === "boolean") fields[k] = { booleanValue: v };
        else if (typeof v === "number") fields[k] = { doubleValue: v };
        else fields[k] = { stringValue: v == null ? "" : String(v) };
      }
      return { fields: fields };
    }

    function fromFirestoreDoc(docObj) {
      var f = docObj.fields || {};
      var out = {};
      for (var k in f) {
        var val = f[k];
        if ("stringValue" in val) out[k] = val.stringValue;
        else if ("booleanValue" in val) out[k] = val.booleanValue;
        else if ("integerValue" in val) out[k] = Number(val.integerValue);
        else if ("doubleValue" in val) out[k] = Number(val.doubleValue);
      }
      if (!out.id && !out.docId && docObj.name) {
        var tail = docObj.name.split("/").pop();
        out.id = tail;
        out.docId = tail;
      }
      return out;
    }

    function setSyncBadge(status, label, detailMsg) {
      var badge = document.getElementById("syncBadge");
      var dot = document.getElementById("syncDot");
      var text = document.getElementById("syncText");
      var alertBanner = document.getElementById("rulesAlertBanner");
      var alertText = document.getElementById("rulesAlertText");

      if (text) text.textContent = label;
      if (alertBanner) alertBanner.classList.add("hidden");

      if (status === "live") {
        if (badge) badge.className = "flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-emerald-500/25 border border-emerald-300/50 text-emerald-100";
        if (dot) dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-400";
      } else if (status === "blocked") {
        if (badge) badge.className = "flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-red-500/30 border border-red-200 text-white";
        if (dot) dot.className = "w-2.5 h-2.5 rounded-full bg-red-300 animate-ping";
        if (detailMsg && alertText) alertText.innerHTML = detailMsg;
        if (alertBanner) alertBanner.classList.remove("hidden");
      } else {
        if (badge) badge.className = "flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-amber-500/20 border border-amber-300/40 text-amber-100";
        if (dot) dot.className = "w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse";
      }
    }

    function persistAllAndRender() {
      try {
        guests.sort(function (a, b) { return (b.registeredAt || "").localeCompare(a.registeredAt || ""); });
        localStorage.setItem(LOCAL_GUESTS_KEY, JSON.stringify(guests));
        localStorage.setItem(LOCAL_SCORING_KEY, JSON.stringify(scoringState));
      } catch (e) {}

      try { document.getElementById("navCountBadge").textContent = guests.length; } catch (e) {}
      try { document.getElementById("navContestantBadge").textContent = scoringState.contestants.length; } catch (e) {}
      try { document.getElementById("configCriteriaInput").value = scoringState.criteria.map(function (c) { return c.name + ":" + c.max; }).join(", "); } catch (e) {}

      try { renderDashboard(); } catch (e) {}
      try { renderRecentScans(); } catch (e) {}
      try { renderCriteriaInputs(); } catch (e) {}
      try { renderContestantDropdowns(); } catch (e) {}
      try { renderRecentBallots(); } catch (e) {}
      try { renderLeaderboard(); } catch (e) {}
      try { renderAdminTable(); } catch (e) {}
    }

    function fetchWithTimeout(url, options, ms) {
      return new Promise(function (resolve, reject) {
        var timer = setTimeout(function () {
          reject(new Error("Timeout (" + (ms / 1000) + "s)"));
        }, ms || 8000);
        fetch(url, options).then(function (res) {
          clearTimeout(timer);
          resolve(res);
        }).catch(function (err) {
          clearTimeout(timer);
          reject(err);
        });
      });
    }

    async function syncFromCloud(showNotification) {
      if (isSyncingNow) return;
      isSyncingNow = true;

      try {
        var guestRes = await fetchWithTimeout(GUESTS_URL + "&pageSize=500", { cache: "no-store" }, 8000);
        if (guestRes.status === 403) {
          setSyncBadge("blocked", "Error 403: Blocked", "<strong>Firestore Rules Blocked (403):</strong> Open Firebase Console &rarr; Firestore &rarr; Rules and publish <code>allow read, write: if true;</code>");
          return;
        }
        if (guestRes.status === 404) {
          setSyncBadge("blocked", "Error 404: No DB", "<strong>Firestore Database Not Created (404):</strong> Open Firebase Console &rarr; Firestore and click <strong>Create database</strong>.");
          return;
        }
        if (!guestRes.ok) throw new Error("Guests HTTP " + guestRes.status);

        var guestData = await guestRes.json();
        var remoteGuests = (guestData.documents || []).map(fromFirestoreDoc);
        var remoteGuestIds = {};
        remoteGuests.forEach(function (g) { remoteGuestIds[g.id] = true; });
        for (var i = 0; i < guests.length; i++) {
          if (guests[i].id && !remoteGuestIds[guests[i].id]) {
            await pushGuestToCloud(guests[i]);
            remoteGuests.push(guests[i]);
          }
        }
        guests = remoteGuests;

        // Fetch scoring collection independently so even if empty it succeeds
        var scoreRes = await fetchWithTimeout(SCORING_URL + "&pageSize=500", { cache: "no-store" }, 8000);
        if (scoreRes.ok) {
          var scoreData = await scoreRes.json();
          var scoreDocs = (scoreData.documents || []).map(fromFirestoreDoc);
          var remoteContestants = [];
          var remoteScores = [];

          scoreDocs.forEach(function (d) {
            if (d.recordType === "config" && d.criteriaJson) {
              try { scoringState.criteria = JSON.parse(d.criteriaJson); } catch (e) {}
            } else if (d.recordType === "contestant") {
              remoteContestants.push(d);
            } else if (d.recordType === "score") {
              try { d.breakdown = JSON.parse(d.breakdownJson || "{}"); } catch (e) { d.breakdown = {}; }
              remoteScores.push(d);
            }
          });

          remoteContestants.sort(function (a, b) { return (a.entryNo || "").localeCompare(b.entryNo || ""); });
          remoteScores.sort(function (a, b) { return (b.submittedAt || "").localeCompare(a.submittedAt || ""); });

          scoringState.contestants = remoteContestants;
          scoringState.scores = remoteScores;
        }

        setSyncBadge("live", "Synced (" + guests.length + " Guests • " + scoringState.contestants.length + " Teams)");
        persistAllAndRender();
        if (showNotification) showToast("Synced guests & scoring from cloud!", "success");
      } catch (err) {
        setSyncBadge("connecting", "Offline: " + (err.message || "Network"));
        if (showNotification) showToast("Sync error: " + (err.message || "Check connection"), "warning");
      } finally {
        isSyncingNow = false;
      }
    }

    function forceCloudSync() {
      isSyncingNow = false;
      setSyncBadge("connecting", "Syncing...");
      syncFromCloud(true);
    }

    // =========================================================
    // GUEST ATTENDANCE CLOUD & UI FUNCTIONS
    // =========================================================
    async function pushGuestToCloud(guest) {
      var idx = guests.findIndex(function (g) { return g.id === guest.id; });
      if (idx >= 0) guests[idx] = guest;
      else guests.unshift(guest);
      persistAllAndRender();

      var docUrl = "https://firestore.googleapis.com/v1/projects/" + FIREBASE_PROJECT_ID + "/databases/(default)/documents/" + GUESTS_COLLECTION + "/" + encodeURIComponent(guest.id) + "?key=" + FIREBASE_API_KEY;
      try {
        var res = await fetch(docUrl, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(toFirestoreFields(guest))
        });
        if (res.status === 403) setSyncBadge("blocked", "Error 403: Blocked");
      } catch (err) {}
    }

    async function deleteGuestFromCloud(guestId) {
      guests = guests.filter(function (g) { return g.id !== guestId; });
      persistAllAndRender();
      var docUrl = "https://firestore.googleapis.com/v1/projects/" + FIREBASE_PROJECT_ID + "/databases/(default)/documents/" + GUESTS_COLLECTION + "/" + encodeURIComponent(guestId) + "?key=" + FIREBASE_API_KEY;
      await fetch(docUrl, { method: "DELETE" }).catch(function () {});
    }

    async function deleteAllRecords() {
      if (!guests.length) {
        showToast("Guest list is already empty.", "warning");
        return;
      }
      var count = guests.length;
      if (!confirm("Are you sure you want to delete ALL " + count + " guest records? This cannot be undone.")) return;
      if (!confirm("FINAL WARNING: This will permanently erase all " + count + " guests and check-in history across all devices. Proceed?")) return;

      isSyncingNow = true;
      var btn = document.getElementById("deleteAllBtn");
      var originalHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span>Deleting ' + count + '...</span>';

      var idsToDelete = guests.map(function (g) { return g.id; });
      guests = [];
      currentPassGuest = null;
      currentPassDataUrl = null;
      try { localStorage.removeItem(LOCAL_GUESTS_KEY); } catch (e) {}
      persistAllAndRender();

      try {
        for (var i = 0; i < idsToDelete.length; i++) {
          var docUrl = "https://firestore.googleapis.com/v1/projects/" + FIREBASE_PROJECT_ID + "/databases/(default)/documents/" + GUESTS_COLLECTION + "/" + encodeURIComponent(idsToDelete[i]) + "?key=" + FIREBASE_API_KEY;
          await fetch(docUrl, { method: "DELETE" }).catch(function () {});
        }
        setSyncBadge("live", "Synced (0 Guests • " + scoringState.contestants.length + " Teams)");
        showToast("Deleted all " + count + " guest records.", "success");
      } finally {
        isSyncingNow = false;
        btn.disabled = false;
        btn.innerHTML = originalHtml;
      }
    }

    function roundRectPath(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }
