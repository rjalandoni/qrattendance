<!-- Universal Mobile + Desktop Cloud Sync Engine (No Module Blockers) -->
  <script>
    const FIREBASE_PROJECT_ID = "qrattendance-39ba7";
    const FIREBASE_API_KEY = "AIzaSyA_mpRuJB1Dl1LE_8dVuuRnpvp3uaTiU0Y";
    const COLLECTION_NAME = "christmas_guests";
    const REST_BASE_URL = "https://firestore.googleapis.com/v1/projects/" + FIREBASE_PROJECT_ID + "/databases/(default)/documents/" + COLLECTION_NAME + "?key=" + FIREBASE_API_KEY;
    const LOCAL_KEY = "xmas_2026_guests_cache";

    let guests = JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]");
    let currentPassGuest = null;
    let html5QrScanner = null;
    let isSyncingNow = false;

    function toFirestoreFields(obj) {
      const fields = {};
      for (const k in obj) {
        const v = obj[k];
        if (typeof v === "boolean") fields[k] = { booleanValue: v };
        else if (typeof v === "number") fields[k] = { integerValue: String(v) };
        else fields[k] = { stringValue: v == null ? "" : String(v) };
      }
      return { fields: fields };
    }

    function fromFirestoreDoc(docObj) {
      const f = docObj.fields || {};
      const out = {};
      for (const k in f) {
        const val = f[k];
        if ("stringValue" in val) out[k] = val.stringValue;
        else if ("booleanValue" in val) out[k] = val.booleanValue;
        else if ("integerValue" in val) out[k] = Number(val.integerValue);
      }
      if (!out.id && docObj.name) {
        out.id = docObj.name.split("/").pop();
      }
      return out;
    }

    function setSyncBadge(state, label) {
      const badge = document.getElementById("syncBadge");
      const dot = document.getElementById("syncDot");
      const text = document.getElementById("syncText");
      const alertBanner = document.getElementById("rulesAlertBanner");

      text.textContent = label;
      alertBanner.classList.add("hidden");

      if (state === "live") {
        badge.className = "flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-emerald-500/25 border border-emerald-300/50 text-emerald-100";
        dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-400";
      } else if (state === "blocked") {
        badge.className = "flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-red-500/30 border border-red-200 text-white";
        dot.className = "w-2.5 h-2.5 rounded-full bg-red-300 animate-ping";
        alertBanner.classList.remove("hidden");
      } else {
        badge.className = "flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-amber-500/20 border border-amber-300/40 text-amber-100";
        dot.className = "w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse";
      }
    }

    function persistLocalAndRender() {
      guests.sort((a, b) => (b.registeredAt || "").localeCompare(a.registeredAt || ""));
      localStorage.setItem(LOCAL_KEY, JSON.stringify(guests));
      document.getElementById("navCountBadge").textContent = guests.length;
      renderDashboard();
      renderRecentScans();
    }

    async function syncFromCloud(showNotification) {
      if (isSyncingNow) return;
      isSyncingNow = true;

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);

      try {
        const res = await fetch(REST_BASE_URL + "&pageSize=500&_t=" + Date.now(), {
          signal: controller.signal,
          cache: "no-store"
        });
        clearTimeout(timeoutId);

        if (res.status === 403) {
          setSyncBadge("blocked", "Rules Blocked (Check Console)");
          isSyncingNow = false;
          return;
        }
        if (!res.ok) throw new Error("HTTP " + res.status);

        const data = await res.json();
        const remoteList = (data.documents || []).map(fromFirestoreDoc);

        // Push any local-only guests up to cloud
        const remoteIds = new Set(remoteList.map(g => g.id));
        for (const localGuest of guests) {
          if (localGuest.id && !remoteIds.has(localGuest.id)) {
            await pushGuestToCloud(localGuest);
            remoteList.push(localGuest);
          }
        }

        guests = remoteList;
        setSyncBadge("live", "Synced (" + guests.length + " Guests)");
        persistLocalAndRender();
        if (showNotification) showToast("Synced " + guests.length + " guests from cloud!", "success");
      } catch (err) {
        clearTimeout(timeoutId);
        setSyncBadge("connecting", "Retrying Network...");
        if (showNotification) showToast("Network timeout — check mobile data/Wi-Fi", "warning");
      } finally {
        isSyncingNow = false;
      }
    }

    async function pushGuestToCloud(guest) {
      const idx = guests.findIndex(g => g.id === guest.id);
      if (idx >= 0) guests[idx] = guest;
      else guests.unshift(guest);
      persistLocalAndRender();

      const docUrl = "https://firestore.googleapis.com/v1/projects/" + FIREBASE_PROJECT_ID + "/databases/(default)/documents/" + COLLECTION_NAME + "/" + encodeURIComponent(guest.id) + "?key=" + FIREBASE_API_KEY;
      try {
        const res = await fetch(docUrl, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(toFirestoreFields(guest))
        });
        if (res.status === 403) {
          setSyncBadge("blocked", "Rules Blocked (Check Console)");
        } else if (res.ok) {
          setSyncBadge("live", "Synced (" + guests.length + " Guests)");
        }
      } catch (err) {
        setSyncBadge("connecting", "Offline (Saved Locally)");
      }
    }

    async function deleteGuestFromCloud(guestId) {
      guests = guests.filter(g => g.id !== guestId);
      persistLocalAndRender();
      const docUrl = "https://firestore.googleapis.com/v1/projects/" + FIREBASE_PROJECT_ID + "/databases/(default)/documents/" + COLLECTION_NAME + "/" + encodeURIComponent(guestId) + "?key=" + FIREBASE_API_KEY;
      await fetch(docUrl, { method: "DELETE" }).catch(() => {});
    }

    window.forceCloudSync = () => {
      setSyncBadge("connecting", "Syncing...");
      syncFromCloud(true);
    };

    function getPublicQrUrl(guestId) {
      return "https://api.qrserver.com/v1/create-qr-code/?size=280x280&margin=10&data=" + encodeURIComponent(guestId);
    }

    async function sendQrEmail(guest) {
      const qrUrl = getPublicQrUrl(guest.id);
      const templateParams = {
        to_name: guest.name,
        to_email: guest.email,
        guest_id: guest.id,
        guest_type: guest.type,
        table_info: guest.table || "Open Seating",
        event_name: "Christmas Party 2026",
        qr_code_url: qrUrl,
        qr_image_url: qrUrl,
        message: "Hi " + guest.name + ", your Christmas Party QR Pass ID is " + guest.id + ". View QR: " + qrUrl
      };

      try {
        await emailjs.send(
          window.EMAILJS_CONFIG.serviceId,
          window.EMAILJS_CONFIG.templateId,
          templateParams
        );
        guest.emailSent = true;
        await pushGuestToCloud(guest);
        showToast("QR Pass emailed to " + guest.email + "!", "success");
      } catch (err) {
        showToast("Registered, but email failed: " + (err && err.text ? err.text : "Check EmailJS"), "warning");
      }
    }

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("guestName").value.trim();
      const email = document.getElementById("guestEmail").value.trim();
      const type = document.getElementById("guestType").value;
      const table = document.getElementById("guestTable").value.trim();
      const shouldEmail = document.getElementById("autoSendEmail").checked;

      const randomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
      const guest = {
        id: "XMAS-2026-" + randomCode,
        name: name,
        email: email,
        type: type,
        table: table,
        checkedIn: false,
        checkInTime: "",
        emailSent: false,
        registeredAt: new Date().toISOString()
      };

      renderPassPreview(guest);
      await pushGuestToCloud(guest);
      showToast("Registered & synced " + guest.name + "!", "success");

      if (shouldEmail) {
        await sendQrEmail(guest);
      }

      e.target.reset();
      document.getElementById("autoSendEmail").checked = true;
    });

    function renderPassPreview(guest) {
      currentPassGuest = guest;
      const container = document.getElementById("qrCanvasContainer");
      container.innerHTML = "";
      new QRCode(container, {
        text: guest.id,
        width: 180,
        height: 180,
        colorDark: "#7f1d1d",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      document.getElementById("passBadgeType").textContent = guest.type.toUpperCase();
      document.getElementById("passGuestName").textContent = guest.name;
      document.getElementById("passGuestEmail").textContent = guest.email;
      document.getElementById("passGuestId").textContent = guest.id;
      document.getElementById("passActions").classList.remove("hidden");
    }

    function resendCurrentPassEmail() {
      if (currentPassGuest) sendQrEmail(currentPassGuest);
    }

    function downloadCurrentQrPng() {
      if (!currentPassGuest) return;
      const canvas = document.querySelector("#qrCanvasContainer canvas");
      if (!canvas) return;
      const link = document.createElement("a");
      link.download = currentPassGuest.id + "_" + currentPassGuest.name.replace(/\s+/g, "_") + ".png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    function playBeep(success) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = success ? "sine" : "sawtooth";
        osc.frequency.setValueAtTime(success ? 880 : 220, ctx.currentTime);
        if (success) osc.frequency.setValueAtTime(1174.66, ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } catch (e) {}
    }

    async function handleCheckInScan(rawCode) {
      const code = (rawCode || "").trim().toUpperCase();
      if (!code) return;

      // Refresh from cloud right before validating scan so phone has latest registrations
      await syncFromCloud(false);

      const resultBox = document.getElementById("scanResultBox");
      const guest = guests.find(g => g.id.toUpperCase() === code);

      if (!guest) {
        playBeep(false);
        resultBox.className = "bg-red-50 rounded-2xl shadow-sm border-2 border-red-500 p-6 text-center";
        resultBox.innerHTML = '<h3 class="text-lg font-extrabold text-red-800">Invalid QR Code</h3><p class="text-sm text-red-700 mt-1">No guest found for ID <span class="font-mono font-bold">' + code + '</span></p>';
        return;
      }

      if (guest.checkedIn) {
        playBeep(false);
        resultBox.className = "bg-amber-50 rounded-2xl shadow-sm border-2 border-amber-500 p-6 text-center";
        resultBox.innerHTML = '<span class="px-3 py-1 rounded-full text-xs font-bold bg-amber-200 text-amber-900">ALREADY CHECKED IN</span><h3 class="text-xl font-extrabold text-slate-900 mt-2">' + guest.name + '</h3><p class="text-xs text-slate-600 mt-1">Checked in at ' + guest.checkInTime + '</p>';
        return;
      }

      guest.checkedIn = true;
      guest.checkInTime = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      await pushGuestToCloud(guest);

      playBeep(true);
      resultBox.className = "bg-emerald-50 rounded-2xl shadow-sm border-2 border-emerald-600 p-6 text-center";
      resultBox.innerHTML = '<span class="px-3 py-1 rounded-full text-xs font-bold bg-emerald-200 text-emerald-900">WELCOME TO THE PARTY!</span><h3 class="text-2xl font-extrabold text-emerald-950 mt-2">' + guest.name + '</h3><p class="text-sm font-semibold text-emerald-800">' + guest.type + (guest.table ? " • " + guest.table : "") + '</p><p class="text-xs text-emerald-700 mt-1">Checked in at ' + guest.checkInTime + '</p>';
    }

    let lastScanText = "";
    let lastScanTime = 0;

    function startCameraScanner() {
      document.getElementById("startCamBtn").classList.add("hidden");
      document.getElementById("stopCamBtn").classList.remove("hidden");

      html5QrScanner = new Html5Qrcode("reader");
      html5QrScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        (decodedText) => {
          const now = Date.now();
          if (decodedText === lastScanText && now - lastScanTime < 3000) return;
          lastScanText = decodedText;
          lastScanTime = now;
          handleCheckInScan(decodedText);
        },
        () => {}
      ).catch(() => {
        showToast("Camera permission denied or requires HTTPS", "warning");
        stopCameraScanner();
      });
    }

    function stopCameraScanner() {
      if (html5QrScanner) {
        html5QrScanner.stop().catch(() => {});
        html5QrScanner = null;
      }
      document.getElementById("reader").innerHTML = 'Click "Start Camera" to scan attendee passes';
      document.getElementById("startCamBtn").classList.remove("hidden");
      document.getElementById("stopCamBtn").classList.add("hidden");
    }

    function renderDashboard() {
      const q = (document.getElementById("searchInput").value || "").toLowerCase();
      const filter = document.getElementById("filterStatus").value;

      const checkedCount = guests.filter(g => g.checkedIn).length;
      document.getElementById("statTotal").textContent = guests.length;
      document.getElementById("statCheckedIn").textContent = checkedCount;
      document.getElementById("statPending").textContent = guests.length - checkedCount;

      const filtered = guests.filter(g => {
        const matchesQuery =
          (g.name || "").toLowerCase().includes(q) ||
          (g.email || "").toLowerCase().includes(q) ||
          (g.id || "").toLowerCase().includes(q);
        if (!matchesQuery) return false;
        if (filter === "checked_in") return g.checkedIn;
        if (filter === "pending") return !g.checkedIn;
        return true;
      });

      const tbody = document.getElementById("guestTableBody");
      if (!filtered.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="py-8 text-center text-slate-400">No matching guests found.</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(g => {
        const emailBadge = g.emailSent
          ? '<span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 font-semibold">Sent</span>'
          : '<button onclick="triggerResend(\'' + g.id + '\')" class="px-2 py-0.5 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold">Send QR</button>';
        const statusBadge = g.checkedIn
          ? '<span class="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 font-bold">Checked In (' + g.checkInTime + ')</span>'
          : '<span class="px-2.5 py-1 rounded-full bg-amber-100 text-amber-800 font-semibold">Pending</span>';

        return '<tr class="hover:bg-slate-50">' +
          '<td class="py-3 px-4 font-mono text-xs font-bold text-red-700">' + g.id + '</td>' +
          '<td class="py-3 px-4"><div class="font-semibold text-slate-900">' + g.name + '</div><div class="text-xs text-slate-500">' + g.email + '</div></td>' +
          '<td class="py-3 px-4 text-xs"><span class="font-semibold text-slate-700">' + g.type + '</span>' + (g.table ? '<div class="text-slate-400">' + g.table + '</div>' : '') + '</td>' +
          '<td class="py-3 px-4 text-xs">' + emailBadge + '</td>' +
          '<td class="py-3 px-4 text-xs">' + statusBadge + '</td>' +
          '<td class="py-3 px-4 text-right space-x-1">'
