<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Christmas Party 2026 — QR Attendance & Check-In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    window.EMAILJS_CONFIG = {
      publicKey: "kqIzEf-5-Noa9NWNR",
      serviceId: "service_h3hfprm",
      templateId: "template_n9u8619"
    };
    window.addEventListener("DOMContentLoaded", function () {
      if (window.emailjs && window.EMAILJS_CONFIG.publicKey) {
        emailjs.init({ publicKey: window.EMAILJS_CONFIG.publicKey });
      }
    });
  </script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #printablePass, #printablePass * { visibility: visible; }
      #printablePass {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 360px;
        border: 2px solid #991b1b;
      }
    }
    .festive-bg {
      background: radial-gradient(circle at top right, #991b1b 0%, #7f1d1d 45%, #14532d 100%);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="festive-bg text-white shadow-lg sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="bg-amber-400 text-red-950 p-2.5 rounded-xl shadow-md">
          <i data-lucide="sparkles" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-xl sm:text-2xl font-bold tracking-tight">Christmas Party 2026</h1>
          <p class="text-xs sm:text-sm text-amber-200/90">Multi-Device QR Registration, Email Pass & Check-In</p>
        </div>
      </div>

      <div class="flex items-center gap-2.5">
        <div id="syncBadge" class="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-amber-500/20 border border-amber-300/40 text-amber-100">
          <span id="syncDot" class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
          <span id="syncText">Connecting...</span>
        </div>
        <button onclick="forceCloudSync()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white/15 hover:bg-white/25 text-xs font-semibold transition border border-white/20">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
          <span>Sync Now</span>
        </button>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex gap-2 border-t border-white/15 pt-2 overflow-x-auto">
      <button onclick="switchTab('register')" id="tab-register" class="tab-btn px-4 py-2.5 text-sm font-semibold rounded-t-lg bg-slate-50 text-red-900 flex items-center gap-2 whitespace-nowrap">
        <i data-lucide="user-plus" class="w-4 h-4"></i>
        <span>1. Register & Send QR</span>
      </button>
      <button onclick="switchTab('scanner')" id="tab-scanner" class="tab-btn px-4 py-2.5 text-sm font-semibold rounded-t-lg text-white/85 hover:bg-white/10 flex items-center gap-2 whitespace-nowrap">
        <i data-lucide="scan-line" class="w-4 h-4"></i>
        <span>2. Staff QR Scanner</span>
      </button>
      <button onclick="switchTab('dashboard')" id="tab-dashboard" class="tab-btn px-4 py-2.5 text-sm font-semibold rounded-t-lg text-white/85 hover:bg-white/10 flex items-center gap-2 whitespace-nowrap">
        <i data-lucide="users" class="w-4 h-4"></i>
        <span>3. Guest List & Excel</span>
        <span id="navCountBadge" class="ml-1 px-2 py-0.5 text-xs rounded-full bg-amber-400 text-red-950 font-bold">0</span>
      </button>
    </div>
  </header>

  <!-- Firestore Rules Alert Banner -->
  <div id="rulesAlertBanner" class="hidden bg-red-600 text-white px-4 py-3 text-sm">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
      <span><strong>Firestore Rules Blocked:</strong> Open Firebase Console &rarr; Firestore &rarr; Rules and publish <code class="bg-red-800 px-1.5 py-0.5 rounded">allow read, write: if true;</code></span>
      <a href="https://console.firebase.google.com/project/qrattendance-39ba7/firestore/rules" target="_blank" class="underline font-bold">Open Firestore Rules &rarr;</a>
    </div>
  </div>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

    <!-- TAB 1: REGISTRATION -->
    <section id="view-register" class="grid grid-cols-1 lg:grid-cols-1
